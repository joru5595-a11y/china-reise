<style>
:root{--bg:#FAF4E8;--card:#FFFFFF;--ink:#2B2320;--ink2:#6E6258;--red:#A61B1B;--gold:#C9A227;--line:rgba(43,35,32,.14);--err:#A61B1B;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#120E0D;--card:#1E1817;--ink:#F4EDE4;--ink2:#A89C91;--line:rgba(255,255,255,.14);--err:#F08A78;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue",system-ui,sans-serif}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.card{width:100%;max-width:380px;background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.head{background:var(--red);color:#F3D36B;padding:22px 22px 18px;position:relative;border-bottom:3px solid var(--gold)}
.head small{display:block;letter-spacing:.18em;font-size:11px;color:#E9CF7A;opacity:.9}
.head b{display:block;font:700 44px/1.1 "PingFang SC","Hiragino Sans GB","Noto Serif SC",serif;margin-top:6px}
.head span{display:block;color:#FFF3D6;font-size:15px;margin-top:2px}
.seal{position:absolute;right:18px;top:20px;width:42px;height:42px;border:2px solid #F3D36B;border-radius:6px;display:flex;align-items:center;justify-content:center;font:700 22px "PingFang SC","Noto Serif SC",serif;color:#F3D36B}
.body{padding:20px 22px 22px}
label{display:block;font-size:14px;color:var(--ink2);margin-bottom:8px}
input{width:100%;font-size:17px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);outline:none}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.25)}
button{margin-top:14px;width:100%;font:600 17px -apple-system,system-ui,sans-serif;padding:14px;border:0;border-radius:12px;background:var(--red);color:#FFF3D6}
button:disabled{opacity:.6}
.msg{min-height:22px;margin-top:10px;font-size:14px;color:var(--err)}
.hint{font-size:13px;color:var(--ink2);margin-top:6px}
.foot{text-align:center;color:var(--gold);font:15px "PingFang SC","Noto Serif SC",serif;letter-spacing:.3em;margin-top:6px}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink2);font-size:15px}
</style>
</head>

var KEY="rpc-offline-key";
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function toB64(buf){var u=new Uint8Array(buf),s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
async function derive(pw){
 var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function open(key){
 var buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.ct));
 var html=new TextDecoder().decode(buf);
 if(!/reiseplan/i.test(html))throw new Error("bad");
 return html;
}
function show(html){
 // Erst ersetzen, wenn die Ladeseite fertig geparst ist – sonst würde die App nur angehängt.
 function go(){setTimeout(function(){document.open();document.write(html);document.close()},0)}
 if(document.readyState==="complete")go();else window.addEventListener("load",go,{once:true});
}
function lock(){document.getElementById("boot").hidden=true;document.getElementById("lock").hidden=false;setTimeout(function(){document.getElementById("pw").focus()},50)}
async function start(){
 if(!window.crypto||!crypto.subtle){document.getElementById("boot").textContent="Bitte über die https-Adresse in Safari öffnen.";return}
 var raw=lsGet(KEY);
 if(raw){
  try{var k=await crypto.subtle.importKey("raw",b64(raw),{name:"AES-GCM"},false,["decrypt"]);show(await open(k));return}
  catch(e){lsDel(KEY)}
 }
 lock();
}
document.getElementById("f").addEventListener("submit",async function(ev){
 ev.preventDefault();
 var b=document.getElementById("go"),m=document.getElementById("msg"),pw=document.getElementById("pw").value.trim();
 b.disabled=true;m.textContent="";b.textContent="Wird entschlüsselt …";
 try{var k=await derive(pw);var html=await open(k);lsSet(KEY,toB64(await crypto.subtle.exportKey("raw",k)));show(html)}
 catch(e){m.textContent="Passwort stimmt nicht. Groß-/Kleinschreibung beachten.";b.disabled=false;b.textContent="Öffnen"}
});
if("serviceWorker" in navigator&&window.isSecureContext){try{navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}}
start();
})();
