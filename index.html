<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Reiseplan China">
<title>Reiseplan China</title>
<style>
:root{
  color-scheme:light;
  --bg:#F6F4F1;--surface:#FFFFFF;--surface2:#ECE8E3;
  --text:#1D1B19;--text2:#6E6760;--ring:rgba(29,27,25,.10);
  --accent:#BE3A26;--accent-soft:#F6E3DE;--on-accent:#FFFFFF;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --cn:"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --bg:#0C0B0B;--surface:#1B1A19;--surface2:#2A2826;
  --text:#F4F1ED;--text2:#A59E96;--ring:rgba(255,255,255,.10);
  --accent:#EC6A52;--accent-soft:rgba(236,106,82,.18);--on-accent:#1A0A06;
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;background:var(--bg);color:var(--text);font:17px/1.4 var(--ui);-webkit-font-smoothing:antialiased}
body{display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
.card{width:100%;max-width:380px;background:var(--surface);border-radius:24px;padding:28px 22px 24px;border:.5px solid var(--ring);box-shadow:0 12px 32px rgba(0,0,0,.08);text-align:center}
.cn{font:700 44px/1 var(--cn);color:var(--accent);margin-bottom:8px}
h1{margin:0 0 6px;font-size:24px;letter-spacing:-.02em}
p{margin:0 0 20px;font-size:14.5px;color:var(--text2)}
form{display:flex;flex-direction:column;gap:12px}
input{width:100%;padding:13px 15px;border-radius:12px;border:1px solid var(--ring);background:var(--bg);color:var(--text);font:17px var(--ui);text-align:center}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{appearance:none;border:0;border-radius:12px;padding:13px 16px;font:600 16px var(--ui);background:var(--accent);color:var(--on-accent);cursor:pointer}
button:active{opacity:.8}
.err{min-height:20px;font-size:13.5px;color:var(--accent);font-weight:600;margin-top:4px}
.spin{opacity:.6;font-size:14px;color:var(--text2)}
</style>
</head>
<body>
<div class="card" id="gate">
  <div class="cn" aria-hidden="true">中国</div>
  <h1>Reiseplan China</h1>
  <p>Bitte Passwort eingeben. Es wird lokal auf diesem Gerät gespeichert.</p>
  <form id="f">
    <input id="pw" type="password" placeholder="Passwort" autocomplete="current-password" required autofocus>
    <button type="submit" id="go">Öffnen</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>

const KEY_STORE = "cn26:aes_raw_key_v4";

function b64ToBytes(b64){
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for(let k=0;k<bin.length;k++) out[k]=bin.charCodeAt(k);
  return out;
}
function bytesToB64(buf){
  const u8 = new Uint8Array(buf);
  let s = "";
  for(let k=0;k<u8.length;k++) s += String.fromCharCode(u8[k]);
  return btoa(s);
}

async function deriveRawKey(pw){
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"]);
  return await crypto.subtle.deriveBits({name:"PBKDF2", salt:b64ToBytes(ENC.s), iterations:ENC.n, hash:"SHA-256"}, baseKey, 256);
}

async function decryptWithRawKey(rawBuf){
  const key = await crypto.subtle.importKey("raw", rawBuf, {name:"AES-GCM"}, false, ["decrypt"]);
  const plainBuf = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64ToBytes(ENC.i)}, key, b64ToBytes(ENC.d));
  return new TextDecoder().decode(plainBuf);
}

function mountApp(html){
  document.open();
  document.write(html);
  document.close();
}

// Auto-unlock if key is already saved on this device
(async()=>{
  try{
    const saved = localStorage.getItem(KEY_STORE);
    if(saved){
      document.getElementById("gate").innerHTML = '<div class="cn">中国</div><h1>Reiseplan China</h1><p class="spin">Wird entschlüsselt …</p>';
      const html = await decryptWithRawKey(b64ToBytes(saved));
      mountApp(html);
      return;
    }
  }catch(e){
    try{ localStorage.removeItem(KEY_STORE); }catch(_){}
    location.reload();
  }
})();

document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const err = document.getElementById("err");
  const btn = document.getElementById("go");
  const pw = document.getElementById("pw").value.trim();
  if(!pw) return;
  err.textContent = "";
  btn.disabled = true;
  btn.textContent = "Prüfe …";
  try{
    const raw = await deriveRawKey(pw);
    const html = await decryptWithRawKey(raw);
    try{ localStorage.setItem(KEY_STORE, bytesToB64(raw)); }catch(_){}
    mountApp(html);
  }catch(ex){
    err.textContent = "Passwort stimmt nicht.";
    btn.disabled = false;
    btn.textContent = "Öffnen";
    document.getElementById("pw").select();
  }
});

if("serviceWorker" in navigator && window.isSecureContext && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
